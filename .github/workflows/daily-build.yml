name: Daily dashboard build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: Last completed stage (same as scripts arg). Predictions/profile/odds use stage+1.
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Used when schedule runs or when workflow_dispatch is started without a stage input.
      DEFAULT_LAST_COMPLETED_STAGE: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dashboard
        run: |
          STAGE="${{ inputs.stage }}"
          if [ -z "$STAGE" ]; then STAGE="$DEFAULT_LAST_COMPLETED_STAGE"; fi
          python scripts/build_dashboard.py --stage "$STAGE"

      - name: Commit updated docs
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update dashboard"
          git push

